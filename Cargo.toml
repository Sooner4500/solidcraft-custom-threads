[package]
name = "custom_threads"
version = "0.2.0"
edition = "2024"
description = "SolidCraft plugin for smooth, exact B-rep custom threads with arbitrary sizes, flank angles, clearances, multi-start leads, collapsed timeline folders, and live parameters."
license = "MIT"
repository = "https://github.com/Sooner4500/solidcraft-custom-threads"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "preview"
path = "src/bin/preview.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
