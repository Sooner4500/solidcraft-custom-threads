[package]
name = "smooth_fdm_threads"
version = "0.1.0"
edition = "2024"
description = "Smooth, low-triangle, FDM-printable custom threads for SolidCraft"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "preview"
path = "src/bin/preview.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
